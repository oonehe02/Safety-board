<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영신공업주식회사 무재해 현황판</title>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:#061a48; }
  body { color:white; }
  .board {
    width:100vw; height:100vh; min-height:620px;
    padding:3vh 4vw;
    display:flex; flex-direction:column; gap:2vh;
    background:linear-gradient(135deg,#0b2c78 0%,#073b9b 48%,#061b55 100%);
  }
  header {
    height:20vh; min-height:105px; max-height:190px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(255,255,255,.97); border-radius:24px;
    padding:1.5vh 3vw;
  }
  header img { max-width:78%; max-height:100%; object-fit:contain; }
  .meta {
    display:grid; grid-template-columns:1fr 1fr; gap:2vw; height:15vh;
  }
  .card {
    background:rgba(1,12,43,.45); border:1px solid rgba(255,255,255,.16);
    border-radius:22px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .label { font-size:clamp(20px,2.7vw,42px); font-weight:800; opacity:.95; margin-bottom:.5vh; }
  .value { font-size:clamp(28px,3.8vw,62px); font-weight:700; }
  .main {
    flex:1; min-height:260px; border-radius:30px;
    background:linear-gradient(180deg,rgba(1,18,60,.74),rgba(0,12,45,.9));
    border:2px solid rgba(255,255,255,.14);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .main .label { font-size:clamp(30px,4.2vw,68px); margin-bottom:1vh; }
  .days { font-size:clamp(120px,21vw,330px); line-height:.9; font-weight:900; letter-spacing:-.06em; color:#fff; text-shadow:0 6px 20px rgba(0,0,0,.3); }
  .days span { font-size:.30em; margin-left:.08em; letter-spacing:0; }
  footer {
    height:11vh; min-height:70px; display:flex; align-items:center; justify-content:center;
    border-radius:18px; background:#16733a; font-size:clamp(20px,2.7vw,44px); font-weight:800;
  }
  .hint { position:fixed; right:12px; bottom:8px; opacity:.38; font-size:11px; }
  @media (orientation:portrait) {
    .board { min-height:100vh; padding:2vh 3vw; }
    header { height:14vh; }
    .meta { height:18vh; }
  }
</style>
</head>

    const today = localMidnight(now);
    const [y,m,d] = START_DATE.split("-").map(Number);
    const start = new Date(y, m-1, d);

    const diff = Math.max(0, Math.floor((today - start) / 86400000));
    document.getElementById("days").textContent = diff.toLocaleString("ko-KR");
    document.getElementById("today").textContent =
      `${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;
    document.getElementById("startDate").textContent =
      `${start.getFullYear()}년 ${start.getMonth()+1}월 ${start.getDate()}일`;

    document.title = `영신공업 무재해 ${diff}일`;
  }

  function scheduleNextUpdate() {
    updateBoard();
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate()+1, 0, 0, 2);
    setTimeout(() => {
      updateBoard();
      scheduleNextUpdate();
    }, next - now);
  }

  scheduleNextUpdate();
  // 장시간 화면 표시 중 시스템 시간 변화에도 주기적으로 확인
  setInterval(updateBoard, 60000);
</script>
</body>
</html>
