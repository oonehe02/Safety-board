<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>영신공업 무재해 현황판</title>
<style>
* {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #0051b8;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
  color: #fff;
}
body {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.board {
  width: min(100vw, 864px);
  min-height: 100vh;
  padding: 5.0vw 2.55vw 3.8vw;
  background:
    radial-gradient(circle at 50% 48%, rgba(0,120,255,.30), transparent 44%),
    linear-gradient(180deg, #063f97 0%, #005bc8 50%, #0758b7 100%);
}
.header {
  width: 100%;
  aspect-ratio: 820 / 218;
  border-radius: 5.5vw;
  overflow: hidden;
  background: #fff;
}
.header img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: fill;
}
.dates {
  margin-top: 4.1vw;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2.4vw;
}
.box {
  background: linear-gradient(180deg, #073d8a 0%, #063779 100%);
  border: .16vw solid rgba(72,174,255,.65);
  border-radius: 5.2vw;
  box-shadow: inset 0 0 3.5vw rgba(0,0,0,.14);
}
.datebox {
  min-height: 29.2vw;
  padding: 3.0vw 1vw 2.4vw;
  text-align: center;
}
.label {
  font-weight: 850;
  font-size: 4.35vw;
  line-height: 1.15;
  margin-bottom: 2.4vw;
  letter-spacing: -.16vw;
}
.date {
  font-weight: 950;
  font-size: 6.5vw;
  line-height: 1.18;
  letter-spacing: -.22vw;
}
.main {
  margin-top: 3.2vw;
  min-height: 58.3vw;
  padding: 7.6vw 2.2vw 3.8vw;
  text-align: center;
  border-radius: 5.4vw;
}
.main-title {
  font-weight: 900;
  font-size: 5.85vw;
  line-height: 1.15;
  letter-spacing: -.25vw;
}
.countrow {
  margin-top: 6.8vw;
  display: flex;
  justify-content: center;
  align-items: baseline;
  gap: 1.2vw;
  white-space: nowrap;
}
.count {
  font-size: 20.5vw;
  font-weight: 950;
  line-height: .88;
  letter-spacing: -1.0vw;
}
.unit {
  font-size: 8.2vw;
  font-weight: 950;
}
.glow {
  margin: 5.0vw auto 0;
  width: 73%;
  height: .26vw;
  border-radius: 50%;
  background: linear-gradient(90deg, transparent, #4ed6ff, #fff, #4ed6ff, transparent);
  box-shadow: 0 0 1.8vw #5ad9ff;
}
.slogan {
  margin-top: 4.0vw;
  min-height: 18.8vw;
  border-radius: 5.4vw;
  border: .16vw solid rgba(167,255,195,.55);
  background: linear-gradient(180deg, #10a948 0%, #07953b 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.helmet {
  font-size: 4.7vw;
  line-height: 1;
  margin-bottom: 1.0vw;
}
.slogan-text {
  font-size: 5.15vw;
  line-height: 1.1;
  font-weight: 950;
  letter-spacing: -.24vw;
}

@media (min-width: 865px) {
  .board { padding: 43px 22px 33px; }
  .header { border-radius: 47px; }
  .dates { margin-top: 35px; gap: 21px; }
  .box { border-radius: 45px; border-width: 1.4px; }
  .datebox { min-height: 252px; padding: 26px 9px 21px; }
  .label { font-size: 38px; margin-bottom: 21px; letter-spacing: -1.4px; }
  .date { font-size: 56px; letter-spacing: -1.9px; }
  .main { margin-top: 28px; min-height: 504px; padding: 66px 19px 33px; border-radius: 47px; }
  .main-title { font-size: 51px; letter-spacing: -2.2px; }
  .countrow { margin-top: 59px; gap: 10px; }
  .count { font-size: 177px; letter-spacing: -8.6px; }
  .unit { font-size: 71px; }
  .glow { margin-top: 43px; height: 2.2px; box-shadow: 0 0 16px #5ad9ff; }
  .slogan { margin-top: 35px; min-height: 162px; border-radius: 47px; }
  .helmet { font-size: 41px; margin-bottom: 9px; }
  .slogan-text { font-size: 45px; letter-spacing: -2.1px; }
}
</style>
</head>

<script>
(function () {
  const START_Y = 2000;
  const START_M = 9;
  const START_D = 20;

  function updateBoard() {
    const now = new Date();
    const y = now.getFullYear();
    const m = now.getMonth() + 1;
    const d = now.getDate();

    // 기준일
    document.getElementById("today").innerHTML =
      y + "년<br>" + m + "월 " + d + "일";

    // 무재해 일수: 기기 시간대 차이 방지를 위해 UTC 날짜값으로 계산
    const startUTC = Date.UTC(START_Y, START_M - 1, START_D);
    const todayUTC = Date.UTC(y, m - 1, d);
    const diffDays = Math.floor((todayUTC - startUTC) / 86400000);

    document.getElementById("days").textContent = diffDays;
  }

  updateBoard();

  // 자정을 넘겨 화면을 계속 켜 두어도 자동 변경
  setInterval(updateBoard, 30000);

  // 아이폰에서 앱 전환 후 돌아왔을 때 즉시 갱신
  document.addEventListener("visibilitychange", function() {
    if (!document.hidden) updateBoard();
  });

  window.addEventListener("pageshow", updateBoard);
})();
</script>
